name: Release candidate checks

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-reference:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install reference test dependencies
        run: python -m pip install -e . pytest
      - name: Configure and build native reference
        run: |
          cmake -S . -B build-ci -DCMAKE_BUILD_TYPE=Release -DPHYTOY_BUILD_VULKAN_SHADERS=OFF
          cmake --build build-ci --parallel 2
      - name: Run native and Python conformance tests
        run: ctest --test-dir build-ci --output-on-failure
      - name: Run release gate failure tests
        run: python -m unittest discover -s tools/tests -v

  android-candidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      # CI produces reviewable unsigned candidates. Signing is a separate local
      # or protected release operation and is never enabled for pull requests.
      PHYTOY_KEYSTORE: ''
      PHYTOY_STORE_PASSWORD: ''
      PHYTOY_KEY_ALIAS: ''
      PHYTOY_KEY_PASSWORD: ''
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned Android build packages
        run: sdkmanager 'platforms;android-37.0' 'build-tools;36.0.0' 'ndk;28.2.13676358' 'cmake;3.22.1'
      - name: Build optimized unsigned APK and AAB and SDK
        working-directory: android
        run: ./gradlew --no-daemon --console=plain :sample:assemblePlayRelease :sample:bundlePlayRelease :sample:assembleGalaxyRelease :sample:bundleGalaxyRelease :sample:assemblePlayBenchmark :sample:assembleGalaxyBenchmark :sample:testPlayDebugUnitTest :sample:testGalaxyDebugUnitTest :sample:lintPlayRelease :sample:lintGalaxyRelease :sdk:assembleRelease
      - name: Audit both store candidates
        run: |
          python tools/check_android_release.py --channel play --apk android/sample/build/outputs/apk/play/release/sample-play-release-unsigned.apk --aab android/sample/build/outputs/bundle/playRelease/sample-play-release.aab --allow-unsigned --output reports/ci-release/play-packaging.json
          python tools/check_android_release.py --channel galaxy --apk android/sample/build/outputs/apk/galaxy/release/sample-galaxy-release-unsigned.apk --aab android/sample/build/outputs/bundle/galaxyRelease/sample-galaxy-release.aab --allow-unsigned --output reports/ci-release/galaxy-packaging.json
      - name: Retain reviewable candidates and diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-release-candidate-${{ github.sha }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            android/sample/build/outputs/apk/
            android/sample/build/outputs/bundle/
            android/sample/build/outputs/mapping/
            android/sample/build/outputs/native-debug-symbols/
            android/sample/build/reports/lint-results-*Release.*
            android/sdk/build/outputs/aar/sdk-release.aar
            reports/ci-release/*-packaging.json
